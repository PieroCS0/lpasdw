<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04040a">
<title>Feliz día de las Flores Amarillas 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cielo: estrellas + partículas doradas flotando, dibujado en canvas -->
  <canvas id="sky"></canvas>

  <!-- Canvas superior solo para las explosiones de partículas al tocar -->
  <canvas id="burst"></canvas>

  <div id="app">

    <header class="title-wrap" id="titleWrap">
      <h1 class="title">
        <span class="line">Feliz día de las</span>
        <span class="line">Flores Amarillas <span class="emoji">🌻</span></span>
      </h1>
    </header>

    <main class="scene" id="scene">
      <div class="glow-ring" id="glowRing" aria-hidden="true"></div>

      <button class="central-flower" id="centralFlower" aria-label="Toca la flor central">
        <!-- la flor SVG central se inserta por JS -->
      </button>

      <div class="field" id="field" aria-hidden="false">
        <!-- las flores del campo se insertan por JS -->
      </div>
    </main>

    <p class="hint" id="hint">Toca las flores ✨</p>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

  </div>

<script src="script.js"></script>
</body>
</html>
